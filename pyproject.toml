[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "python-intermediate-inflammation"
version = "0.0.0"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
]

[tool.setuptools]
packages = ["inflammation"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytype>=2024.9.13",
    "ruff>=0.15.10",
]

[tool.ruff]
line-length = 88

[tool.pytype]
inputs = ['inflammation']
